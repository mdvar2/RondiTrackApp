# The staging flavour's splash (README "Releases"):
#   dart run flutter_native_splash:create --flavor staging
# Android 12 and later crop the icon to a circle; the band stays inside it.
flutter_native_splash:
  color: "#F3F8F4"
  image: assets/branding/splash_staging.png
  color_dark: "#101513"
  android_12:
    color: "#F3F8F4"
    image: assets/branding/splash_staging.png
    color_dark: "#101513"
  ios: false
  web: false
