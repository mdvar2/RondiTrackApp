name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand, optionally against another API branch (README "The API
  # client"): Actions > CI > Run workflow.
  workflow_dispatch:
    inputs:
      api_ref:
        description: API repository branch, tag or commit to compare the contract copy with
        required: false
        default: ""
  # Nightly, so a contract change merged in the API turns this red within a
  # day, not at the next app pull request.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, generate, analyse, test
    # The nightly run checks the contract only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install the locked dependencies
        run: flutter pub get --enforce-lockfile

      # Hand-written code only: build_runner and swagger_parser own the
      # generated files' layout.
      - name: Format check
        run: |
          git ls-files '*.dart' \
            | grep -v -E '\.(g|freezed)\.dart$' \
            | grep -v '^lib/core/data/generated/' \
            | xargs dart format --output=none --set-exit-if-changed

      # The API client is generated from the committed contract copy
      # (README "The API client"). swagger_parser never deletes a file it
      # stopped writing, so the folder goes first.
      - name: Generate the API client from the contract copy
        run: |
          rm -rf lib/core/data/generated
          dart run swagger_parser

      # Generated files are committed (README "Generated code"). Regenerate
      # them and fail if the committed copies are stale.
      - name: Code generation
        run: dart run build_runner build

      # riverpod_generator hashes each provider's source into its .g.dart, so
      # editing a provider without regenerating fails here.
      - name: Generated code is up to date
        run: |
          if ! git diff --exit-code -- '*.g.dart' '*.freezed.dart'; then
            echo "::error title=Generated code is stale::Run 'dart run build_runner build' and commit the generated files."
            exit 1
          fi

      # Any changed, deleted or new file under the client means the committed
      # client isn't what the contract copy generates. --porcelain lists
      # untracked files too, which git diff would miss.
      - name: The client matches the contract copy
        run: |
          drift="$(git status --porcelain --untracked-files=all -- lib/core/data/generated)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff --stat -- lib/core/data/generated
            echo "::error title=The API client drifted from contract/openapi/v1.json::Delete lib/core/data/generated, run 'dart run swagger_parser' and 'dart run build_runner build', and commit the result."
            exit 1
          fi

      # dart analyze, not flutter analyze: only dart analyze runs analyser
      # plugins, and riverpod_lint is one. On failure each finding is also
      # written as an annotation, so it shows on the pull request's diff.
      - name: Analyse
        run: |
          if ! dart analyze --fatal-infos; then
            dart analyze --format=machine 2>&1 | awk -F'|' -v root="$PWD/" '
              NF >= 8 {
                file = $4
                if (index(file, root) == 1) file = substr(file, length(root) + 1)
                message = $8
                for (i = 9; i <= NF; i++) message = message "|" $i
                printf "::error file=%s,line=%s,col=%s,title=%s::%s\n", file, $5, $6, tolower($3), message
              }'
            exit 1
          fi

      # Twice, in two zones (README "Money and dates"): a South African
      # day must not follow the machine's zone. TZ is how Linux chooses a
      # process's zone; each run prints the zone it ran in.
      - name: Test (TZ=UTC)
        env:
          TZ: UTC
        run: |
          date +'Running in %Z (UTC%:z)'
          flutter test

      - name: Test (TZ=Africa/Johannesburg)
        env:
          TZ: Africa/Johannesburg
        run: |
          date +'Running in %Z (UTC%:z)'
          flutter test

  contract:
    name: Contract copy matches the API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The API branch whose openapi/v1.json the app was built against
      # (README "Contract notes"). A workflow input points it elsewhere.
      API_REF: ${{ inputs.api_ref || 'fix/mobile-contract-gaps' }}
    steps:
      - uses: actions/checkout@v4

      # A public repository needs no token. Only the contract is fetched.
      - name: Check out the API's contract
        uses: actions/checkout@v4
        with:
          repository: mdvar2/RondiTrack
          ref: ${{ env.API_REF }}
          path: api
          sparse-checkout: openapi/v1.json
          sparse-checkout-cone-mode: false

      - name: Compare the two openapi/v1.json files
        run: |
          echo "API ref: $API_REF ($(git -C api rev-parse HEAD))"
          if ! diff -u api/openapi/v1.json contract/openapi/v1.json; then
            echo "::error title=The contract copy drifted from the API::contract/openapi/v1.json differs from openapi/v1.json at mdvar2/RondiTrack@$API_REF. Copy the API's file, regenerate the client, and fix what the analyser names."
            exit 1
          fi
          echo "Identical: $(sha256sum contract/openapi/v1.json | cut -c1-16)…"
