include: package:very_good_analysis/analysis_options.yaml

# riverpod_lint is an analysis_server_plugin. Its findings appear in
# `dart analyze` (and the IDE), never in `flutter analyze`.
plugins:
  riverpod_lint: 3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.freezed.dart"
    - "**/*.g.dart"
