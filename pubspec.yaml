name: ronditrack_app
description: "RondiTrack mobile: stokvel contributions, roles and payouts."
publish_to: 'none'

version: 1.0.0+1

# Every version is exact (no ^) and at least two weeks old when added.
# See README "Running it" for the dates checked.
environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: 3.47.7

# cupertino_ui and material_ui are not imported. go_router 18.1.1 accepts any
# 1.x of them, and the newest (1.1.6 and 1.11.0) are under two weeks old, so
# they are pinned to the releases from go_router 18.1.1's week (2026-10-20).
dependencies:
  cupertino_icons: 1.0.9
  cupertino_ui: 1.1.4
  # Week 11: the HTTP client and the generated Retrofit client's runtime.
  dio: 5.11.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: 23.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  # Week 11.2: the refresh token, encrypted at rest (Android Keystore).
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  # gen-l10n's runtime; the version flutter_localizations pins.
  image: 4.12.0
  image_picker: 1.2.4
  intl: 0.20.3
  json_annotation: 4.12.0
  material_ui: 1.8.0
  package_info_plus: 10.2.2
  retrofit: 4.10.0
  riverpod_annotation: 4.0.7
  sentry_flutter: 10.3.0
  shared_preferences: 2.5.6
  uuid: 4.6.0

dev_dependencies:
  alchemist: 0.14.1
  # Not imported. Pinned so the analyser that codegen and riverpod_lint run
  # on is at least two weeks old (14.7.0 was published 2026-10-29).
  analyzer: 14.6.0
  # 2.17.0 is retracted; 2.16.2 is the release known to work with
  # riverpod_generator 4.0.9 and freezed 4.0.3.
  build_runner: 2.16.2
  drift_dev: 2.35.2
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  go_router_builder: 4.5.2
  integration_test:
    sdk: flutter
  json_serializable: 6.15.2
  mocktail: 1.0.5
  retrofit_generator: 10.3.3
  riverpod_generator: 4.0.9
  riverpod_lint: 3.1.9
  # 2.x releases are all under two weeks old; 1.x writes Retrofit clients.
  sentry_dart_plugin: 3.4.0
  swagger_parser: 1.45.1
  very_good_analysis: 11.0.0

# Held back: pub picks the newest of what flutter_secure_storage pulls in
# (through path_provider_android), and these were under two weeks old on
# 2026-11-22. Each is the newest release published by 2026-11-08. Remove
# both lines on or after 2026-12-03 (jni 1.2.1 was published 2026-11-19),
# once `flutter pub get` without them picks nothing under two weeks old.
dependency_overrides:
  # Week 12.2: pulled in by firebase_core 5.1.0, firebase_messaging 17.0.1,
  # flutter_local_notifications 23.0.0 and image_picker 1.2.4, whose newest
  # picks were under two weeks old on 2026-11-25. Each is the newest
  # release published by 2026-11-11; remove each on or after its date, once
  # `flutter pub get` without it picks nothing under two weeks old.
  # 1.4.0 published 2026-11-16: remove on or after 2026-11-30.
  _flutterfire_internals: 1.3.79
  # 4.7.1 published 2026-11-13: remove on or after 2026-11-27.
  archive: 4.6.0
  # Through drift_dev, 0.6.1 published 2026-11-20. Remove on or after
  # 2026-12-04.
  cli_util: 0.6.0
  # 0.8.1 published 2026-11-19: remove on or after 2026-12-03.
  dbus: 0.8.0
  # 8.2.0 published 2026-11-16: remove on or after 2026-11-30.
  firebase_core_platform_interface: 8.1.1
  # 4.2.0 published 2026-11-16: remove on or after 2026-11-30.
  firebase_core_web: 4.1.0
  # 4.12.0 published 2026-11-16: remove on or after 2026-11-30.
  firebase_messaging_platform_interface: 4.11.1
  # 4.4.0 published 2026-11-16: remove on or after 2026-11-30.
  firebase_messaging_web: 4.3.1
  # 0.8.13+16 published 2026-11-19: remove on or after 2026-12-03.
  image_picker_ios: 0.8.13+15
  jni: 1.1.2
  jni_flutter: 1.0.4+1

flutter:
  # gen-l10n (l10n.yaml): English and Afrikaans, from lib/l10n/*.arb.
  generate: true
  uses-material-design: true
