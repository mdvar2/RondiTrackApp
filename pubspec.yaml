name: ronditrack_app
description: "RondiTrack mobile: stokvel contributions, roles and payouts."
publish_to: 'none'

version: 1.0.0+1

# Every version is exact (no ^) and at least two weeks old when added.
# See README "Running it" for the dates checked.
environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: 3.47.7

# cupertino_ui and material_ui are not imported. go_router 18.1.1 accepts any
# 1.x of them, and the newest (1.1.6 and 1.11.0) are under two weeks old, so
# they are pinned to the releases from go_router 18.1.1's week (2026-10-20).
dependencies:
  cupertino_icons: 1.0.9
  cupertino_ui: 1.1.4
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  material_ui: 1.8.0
  riverpod_annotation: 4.0.7

dev_dependencies:
  # Not imported. Pinned so the analyser that codegen and riverpod_lint run
  # on is at least two weeks old (14.7.0 was published 2026-10-29).
  analyzer: 14.6.0
  # 2.17.0 is retracted; 2.16.2 is the release known to work with
  # riverpod_generator 4.0.9 and freezed 4.0.3.
  build_runner: 2.16.2
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  go_router_builder: 4.5.2
  riverpod_generator: 4.0.9
  riverpod_lint: 3.1.9
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
